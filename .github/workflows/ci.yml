name: CI

# Lint, check the message files, build and check the old-URL redirects on
# every push and PR to main, so a broken page, a type error, a missing
# next-intl key or a broken rule in lib/legacy-redirects.ts or proxy.ts fails
# here before Vercel deploys it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check messages
        run: npm run check:messages

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Every old path in scripts/seo/old-paths.json must answer 200 or take
      # one permanent redirect to a page that does.
      - name: Check redirects
        run: |
          npm start -- -p 3000 > next-start.log 2>&1 &
          for i in $(seq 60); do
            curl -s -o /dev/null http://localhost:3000 && break
            sleep 1
          done
          node scripts/seo/check-redirects.mjs || { tail -n 50 next-start.log; exit 1; }
        env:
          NEXT_TELEMETRY_DISABLED: 1
