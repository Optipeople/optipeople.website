name: CI

# Lint, check the message files and build on every push and PR to main, so a
# broken page, a type error or a missing next-intl key fails here before
# Vercel deploys it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check messages
        run: npm run check:messages

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
